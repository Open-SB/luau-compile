[package]
name = "luau-compile"
version = "0.1.0"
edition = "2024"

[features]
default = []
shuttle = ["dep:shuttle-axum", "dep:shuttle-runtime"]

[dependencies]
axum = { version = "0.8.8", features = ["json"] }
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread"] }
mlua = { version = "0.11.5", features = ["luau"] }
serde = { version = "1.0", features = ["derive"] }
shuttle-axum = { version = "0.57.0", optional = true }
shuttle-runtime = { version = "0.57.0", optional = true }
