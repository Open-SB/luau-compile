[package]
name    = "luau-compile"
version = "0.1.0"
edition = "2024"

[features]
default = []
shuttle = ["dep:shuttle-axum", "dep:shuttle-runtime"]

[dependencies]
axum            = { version = "0.8.9", features = ["json"] }
tokio           = { version = "1.54.1", features = ["rt", "rt-multi-thread"] }
mlua            = { version = "0.12.2", features = ["luau"] }
serde           = { version = "1.0", features = ["derive"] }
shuttle-axum    = { version = "0.57.0", optional = true }
shuttle-runtime = { version = "0.57.0", optional = true }
